name: Deploy attorney portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-svelte:
    name: Build Svelte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: worker/svelte/pnpm-lock.yaml
      - name: Install worker deps
        run: cd worker && pnpm install --frozen-lockfile
      - name: Install svelte deps
        run: cd worker/svelte && pnpm install --frozen-lockfile
      - name: Build Svelte
        run: cd worker/svelte && pnpm build
      - name: Upload svelte build
        uses: actions/upload-artifact@v4
        with:
          name: svelte-build
          path: worker/svelte/build/

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build-svelte
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download svelte build
        uses: actions/download-artifact@v4
        with:
          name: svelte-build
          path: worker/svelte/build/
      - name: Install worker deps
        run: cd worker && pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
